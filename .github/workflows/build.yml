name: Build extension
on: [push]

# The release job below deletes the `latest` release before recreating it, so
# two runs overlapping on the same ref could interleave those steps and leave
# no release published at all. One run per ref at a time; superseded runs are
# cancelled rather than queued, since only the newest push is worth publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Platform-independent checks, so they run once rather than per-OS. Node 22:
  # `node --test` only accepts a glob pattern from Node 21 on.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vsce package
      - name: Tag vsix filename with platform
        shell: bash
        # vsce package produces the same filename on every OS; the release
        # job below merges both platforms' artifacts into one directory, so
        # they need distinct names or one silently overwrites the other.
        run: |
          for f in *.vsix; do
            mv "$f" "${f%.vsix}-${{ matrix.os }}.vsix"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.os }}
          path: '*.vsix'

  release:
    # Also gated on `test`, so a failing suite blocks publishing rather than
    # shipping a broken build to the one URL people install from.
    needs: [build, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          path: vsix
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest vsix/*.vsix \
            --repo "$GITHUB_REPOSITORY" \
            --title "Latest build ($(date -u +%Y-%m-%d))" \
            --notes "Auto-published from $GITHUB_SHA on every push to main. Always the newest build — no 90-day artifact expiry." \
            --latest
