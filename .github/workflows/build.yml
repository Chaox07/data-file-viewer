name: Build extension
on: [push]
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npx vsce package
      - name: Tag vsix filename with platform
        shell: bash
        # vsce package produces the same filename on every OS; the release
        # job below merges both platforms' artifacts into one directory, so
        # they need distinct names or one silently overwrites the other.
        run: |
          for f in *.vsix; do
            mv "$f" "${f%.vsix}-${{ matrix.os }}.vsix"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.os }}
          path: '*.vsix'

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          path: vsix
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest vsix/*.vsix \
            --repo "$GITHUB_REPOSITORY" \
            --title "Latest build ($(date -u +%Y-%m-%d))" \
            --notes "Auto-published from $GITHUB_SHA on every push to main. Always the newest build — no 90-day artifact expiry." \
            --latest
